# Conda environment for
# N2O_precision_fertilization code and notebooks.
#
#   conda env create -f environment.yml
#   conda activate n2o-precision-fertilization
#
# `diive` is installed from GitHub and provides the parquet I/O helpers
# (diive.core.io.files.load_parquet) used by the notebooks.
name: n2o-precision-fertilization
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  # core scientific stack
  - numpy=1.26.*
  - pandas=2.2.*
  - scipy=1.13.*
  - scikit-learn=1.5.*
  - statsmodels=0.14.*
  # plotting
  - matplotlib=3.9.*
  - seaborn=0.13.*
  # geospatial (footprint / fertilization / yield maps)
  - geopandas=1.0.*
  - shapely=2.0.*
  - rasterio=1.3.*
  - affine=2.4.*
  - pyproj=3.6.*
  # I/O
  - pyarrow=17.*
  # notebook environment
  - jupyterlab=4.*
  - ipykernel=6.*
  - pip:
      - brokenaxes==0.6.*
      - git+https://github.com/holukas/diive.git@v0.63.1
